<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anamta Asif</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Amiri&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-bg: #0f172a;
            --secondary-bg: #1e293b;
            --text-gold: #fbbf24;
            --text-white: #f8fafc;
            --book-color: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            color: var(--text-white);
        }

        /* Floating Particles/Stars Background */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100px); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            border: 2px solid rgba(251, 191, 36, 0.3);
            border-radius: 15px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.1);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: var(--text-gold);
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        .urdu-name {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: #e2e8f0;
            margin-bottom: 20px;
            direction: rtl;
        }

        .hidden-content {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .typewriter-text {
            font-size: 1.2rem;
            line-height: 1.8;
            margin: 20px 0;
            min-height: 100px;
            color: #cbd5e1;
            font-style: italic;
        }

        .reveal-btn {
            background: transparent;
            border: 1px solid var(--text-gold);
            color: var(--text-gold);
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            letter-spacing: 2px;
            border-radius: 5px;
        }

        .reveal-btn:hover {
            background: var(--text-gold);
            color: var(--primary-bg);
            box-shadow: 0 0 20px var(--text-gold);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .urdu-name { font-size: 2rem; }
            .container { width: 90%; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <div>
            <h1>Happy Birthday</h1>
            <div class="urdu-name">انعمتا آصف</div>
        </div>

        <button id="openBookBtn" class="reveal-btn">Open The Next Chapter</button>

        <div id="wishContent" class="hidden-content">
            <hr style="border: 0; border-top: 1px solid rgba(251, 191, 36, 0.3); margin: 20px 0;">
            <p id="message" class="typewriter-text"></p>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 20px;">- From Yousuf Rajput </p>
        </div>
    </div>

    <script>
        const btn = document.getElementById('openBookBtn');
        const content = document.getElementById('wishContent');
        const messageEl = document.getElementById('message');

        // The Novel-themed Wish Message
        const textToType = "Happy birthday 🎉 it's 2 June again and yeah that's your day. Wishing And  hope you waste your time reading novel asusual. You are the luckiest person cuz you have 🧏🏻 me in your life. I am the best 😎. And enjoy your life And once again 🥳 bhai ka bood day hai party when.? !";

        btn.addEventListener('click', function() {
            // 1. Hide Button & Show Content Container
            btn.style.display = 'none';
            content.style.display = 'block';
            
            // Allow CSS transition to work
            setTimeout(() => {
                content.style.opacity = '1';
            }, 50);

            // 2. Trigger Confetti Effect (Celebration)
            triggerConfetti();

            // 3. Start Typewriter Effect
            typeWriter(textToType, 0);
        });

        // Typewriter Logic
        function typeWriter(text, i) {
            if (i < text.length) {
                messageEl.innerHTML += text.charAt(i);
                setTimeout(function() {
                    typeWriter(text, i + 1);
                }, 50); // Speed of typing
            }
        }

        // Confetti Logic (Fireworks style)
        function triggerConfetti() {
            var duration = 3000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                // since particles fall down, start a bit higher than random
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }
    </script>
</body>
</html>
